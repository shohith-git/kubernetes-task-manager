apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app
          image: tf-app:v1

          envFrom:
            - configMapRef:
                name: tf-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: DATABASE_URL

          imagePullPolicy: IfNotPresent