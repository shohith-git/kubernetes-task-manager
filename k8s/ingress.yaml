apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: tf-ingress
  namespace: taskflow

spec:
  ingressClassName: nginx
  rules:
  - host: taskflow.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: flask-svc
              port:
                number: 5000